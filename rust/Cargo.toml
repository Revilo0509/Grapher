[package]
name = "rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
argmin = { version = "0.10" }
argmin-math = { version = "0.4", features = [
    "ndarray_latest",
    "nalgebra_latest",
] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "ImageData",
    "console",
] }
